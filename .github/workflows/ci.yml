name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    check:
        name: lint, typecheck, test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0

            # bun.lock is gitignored (autogenerated by `bun install`, never
            # committed, see CLAUDE.md), so there's no lockfile to freeze
            # against here, this resolves from package.json ranges each run
            - name: Install dependencies
              run: bun install

            - name: Lint
              run: bun run lint

            - name: Format check
              run: bun run check

            # infra/www's tsconfig.json both list the gitignored,
            # wrangler-generated worker-configuration.d.ts as a types entry,
            # and it isn't committed, so a fresh checkout has no Env type at
            # all without this. wrangler types itself only needs
            # wrangler.jsonc (no live Cloudflare auth), but it also reads
            # .env.local to type each plain env var (VITE_APPNAME,
            # BETTER_AUTH_URL, ...), which doesn't exist in CI either, so
            # .env.example's placeholder values stand in for it here, real
            # secrets are never needed just to typecheck
            - name: Set up placeholder env files
              run: |
                  cp infra/.env.example infra/.env.local
                  cp www/.env.example www/.env.local

            - name: Generate Cloudflare types
              run: bun run type-gen

            # src/routeTree.gen.ts is also gitignored, generated by the
            # @tanstack/router-plugin Vite plugin on dev/build (see
            # CLAUDE.md), not by type-gen. infra/www's route files import it
            # directly, so typecheck fails without it too, a full build is
            # the plugin's only hook to run this codegen outside `dev`
            - name: Build (generates routeTree.gen.ts)
              run: bun run build

            - name: Typecheck
              run: bun run typecheck

            - name: Test
              run: bun run test
