name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    check:
        name: lint, typecheck, test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            # bun.lock is gitignored (autogenerated by `bun install`, never
            # committed, see CLAUDE.md), so there's no lockfile to freeze
            # against here, this resolves from package.json ranges each run
            - name: Install dependencies
              run: bun install

            - name: Lint
              run: bun run lint

            - name: Format check
              run: bun run check

            - name: Typecheck
              run: bun run typecheck

            - name: Test
              run: bun run test
